[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspark-lab"
version = "0.1.0"
description = "PySpark examples for Airflow, Spark Operator, and MinIO practice"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
spark = [
  "pyspark==3.5.1",
]

[tool.setuptools.packages.find]
where = ["src"]
