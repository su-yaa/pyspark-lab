name: Build PySpark Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - pyproject.toml
      - spark/**
      - src/**
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-pyspark-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/su-yaa/pyspark-lab
  GHCR_USERNAME: su-yaa

jobs:
  build:
    name: Build and push linux/arm64 image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check GHCR token
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "${GHCR_TOKEN}" ]; then
            echo "Repository secret GHCR_TOKEN is required to push ghcr.io/su-yaa/pyspark-lab."
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        env:
          IMAGE_MAIN: ${{ env.IMAGE_NAME }}:main
          IMAGE_SHA: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          IMAGE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Build attempt ${attempt}/3"
            if docker buildx build \
              --platform linux/arm64 \
              --push \
              --tag "${IMAGE_MAIN}" \
              --tag "${IMAGE_SHA}" \
              --label "org.opencontainers.image.source=${IMAGE_SOURCE}" \
              --label "org.opencontainers.image.revision=${IMAGE_REVISION}" \
              .; then
              exit 0
            fi

            if [ "${attempt}" -lt 3 ]; then
              sleep_seconds=$((attempt * 30))
              echo "Build failed. Retrying in ${sleep_seconds}s..."
              sleep "${sleep_seconds}"
            fi
          done

          echo "Build failed after 3 attempts."
          exit 1
